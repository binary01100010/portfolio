<header>
  <img src="icon/g.png" alt="logo of website" />
  <div class="hRight">
    <div class="hRightThree">
      <p>About me</p>
      <p>Skills</p>
      <p>Portfolio</p>
    </div>
    <div class="hRightLanguage">
      <div class="hRightLanguage">
        <button
          (click)="language.changeLanguage('de')"
          [class.active]="language.selectedLanguage() === 'de'"
        >
          DE
        </button>

        <button
          (click)="language.changeLanguage('en')"
          [class.active]="language.selectedLanguage() === 'en'"
        >
          EN
        </button>
      </div>
    </div>
  </div>
</header>
